<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- filled square cells suggesting centre-crop -->
  <rect x="2.5" y="2.5" width="8.5" height="8.5" rx="1" fill="#e5a50a"/>
  <rect x="13" y="2.5" width="8.5" height="8.5" rx="1" fill="#f8e45c"/>
  <rect x="2.5" y="13" width="8.5" height="8.5" rx="1" fill="#c64600"/>
  <rect x="13" y="13" width="8.5" height="8.5" rx="1" fill="#ff7800"/>
  <!-- subtle crop marks on centre of top-left cell -->
  <rect x="4.5" y="4.5" width="4.5" height="4.5" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.9"/>
</svg>
