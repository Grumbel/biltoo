<!-- Fit: content fully inside the viewport (letterbox / contain). -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24">
  <!-- Viewport frame -->
  <rect x="3.5" y="3.5" width="17" height="17" rx="1.5" fill="none" stroke="#5e5c64" stroke-width="1.5"/>
  <!-- Content (smaller, centred — fits with margin) -->
  <rect x="7" y="6.5" width="10" height="11" rx="1" fill="#deddda" stroke="#1a9b8a" stroke-width="1.4"/>
  <!-- Inward corner marks = contain -->
  <path d="M5 9V5h4M19 9V5h-4M5 15v4h4M19 15v4h-4" fill="none" stroke="#1a9b8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
