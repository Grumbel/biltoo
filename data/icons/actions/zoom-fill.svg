<!-- Fill: content covers the viewport (may crop edges). -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24">
  <!-- Content extends beyond the frame -->
  <rect x="1.5" y="5" width="21" height="14" rx="1" fill="#deddda" stroke="#1a9b8a" stroke-width="1.3"/>
  <!-- Viewport crop window on top -->
  <rect x="5" y="3.5" width="14" height="17" rx="1.2" fill="none" stroke="#5e5c64" stroke-width="1.6"/>
  <!-- Outward arrows = cover / fill -->
  <path d="M8 12H4.5M4.5 12l1.6-1.6M4.5 12l1.6 1.6" fill="none" stroke="#1a9b8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16 12h3.5M19.5 12l-1.6-1.6M19.5 12l-1.6 1.6" fill="none" stroke="#1a9b8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
