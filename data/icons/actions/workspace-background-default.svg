  <!-- Soft checker hint (app default pattern) -->
  <rect x="5" y="5" width="6" height="6" fill="#3d3d3d"/>
  <rect x="11" y="5" width="6" height="6" fill="#505050"/>
  <rect x="5" y="11" width="6" height="6" fill="#505050"/>
