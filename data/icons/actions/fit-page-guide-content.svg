<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Desk page (same language as print-page-guide) -->
  <rect x="3.5" y="2" width="17" height="20" rx="1.5" fill="#f6f5f4" stroke="#9a9996" stroke-width="1"/>
  <!-- Content tiles -->
  <rect x="7" y="8" width="5.5" height="4.2" rx="0.5" fill="#62a0ea"/>
  <rect x="13.2" y="10.5" width="4.2" height="5.5" rx="0.5" fill="#3584e4"/>
  <!-- Tight dashed guide hugging content -->
  <rect x="6" y="6.5" width="12.2" height="10.5" rx="0.5" fill="none"
        stroke="#1c71d8" stroke-width="1.3" stroke-dasharray="2 1.5"/>
  <!-- Corner fit marks (inward), outside the guide -->
  <path d="M5.2 5.5 H7.2 M5.2 5.5 V7.5" fill="none" stroke="#2e3436" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M18.8 5.5 H16.8 M18.8 5.5 V7.5" fill="none" stroke="#2e3436" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M5.2 18.5 H7.2 M5.2 18.5 V16.5" fill="none" stroke="#2e3436" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M18.8 18.5 H16.8 M18.8 18.5 V16.5" fill="none" stroke="#2e3436" stroke-width="1.4" stroke-linecap="round"/>
</svg>
