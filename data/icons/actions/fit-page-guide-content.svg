<!-- Fit page guide to content: page outline shrinks to content bounds. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24">
  <!-- Outer page (before fit) -->
  <rect x="3.5" y="2" width="17" height="20" rx="1" fill="none" stroke="#9a9996" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  <!-- Content bounds (target) -->
  <rect x="7" y="7" width="10" height="10" rx="1" fill="#e5a50a" fill-opacity="0.35" stroke="#e5a50a" stroke-width="1.4"/>
  <!-- Inward arrows on each side -->
  <path d="M12 4.2v2.2M12 4.2l-1.2 1.2M12 4.2l1.2 1.2" fill="none" stroke="#1a9b8a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12 19.8v-2.2M12 19.8l-1.2-1.2M12 19.8l1.2-1.2" fill="none" stroke="#1a9b8a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M5.2 12h2.2M5.2 12l1.2-1.2M5.2 12l1.2 1.2" fill="none" stroke="#1a9b8a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18.8 12h-2.2M18.8 12l-1.2-1.2M18.8 12l-1.2 1.2" fill="none" stroke="#1a9b8a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
